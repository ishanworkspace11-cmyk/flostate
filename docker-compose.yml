services:
  postgres:
    image: postgres:16-alpine
    container_name: dormammu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dormammu
      POSTGRES_PASSWORD: dormammu_secret
      POSTGRES_DB: dormammu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormammu -d dormammu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dormammu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
